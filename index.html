<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3x3 Rubik's Cube</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>3×3 Rubik's Cube</h1>

      <div class="controls">
        <button id="scrambleBtn" type="button">Scramble</button>
        <button id="solveBtn" type="button" class="secondary">Solve</button>
      </div>

      <div class="cube-net" aria-label="Rubik's cube puzzle">
        <div class="face face-up" data-face="U" aria-label="Up face"></div>

        <div class="middle-row">
          <div class="face face-left" data-face="L" aria-label="Left face"></div>
          <div class="face face-front" data-face="F" aria-label="Front face"></div>
          <div class="face face-right" data-face="R" aria-label="Right face"></div>
          <div class="face face-back" data-face="B" aria-label="Back face"></div>
        </div>

        <div class="face face-down" data-face="D" aria-label="Down face"></div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
