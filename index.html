<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3x3 Rubik's Cube</title>
    <style>
      :root {
        --bg1: #071722;
        --bg2: #10273d;
        --panel: rgba(18, 34, 49, 0.85);
        --text: #eaf6ff;
        --shadow: rgba(0, 0, 0, 0.35);
        --tile-gap: 5px;
        --tile-size: 52px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1) 58%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .app {
        width: min(92vw, 760px);
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        box-shadow: 0 24px 48px var(--shadow);
        padding: 22px 18px 28px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.7rem);
        text-align: center;
      }

      .controls {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 18px 0 22px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, #8bebff, #58b8ff);
        color: #07253e;
        box-shadow: 0 8px 22px rgba(72, 166, 255, 0.42);
      }

      button.secondary {
        background: linear-gradient(135deg, #ecfbff, #d0ebff);
      }

      button.danger {
        background: linear-gradient(135deg, #ffd7d7, #ffb4b4);
      }

      .cube-wrap {
        display: flex;
        justify-content: center;
        padding-top: 10px;
      }

      .cube-net {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        user-select: none;
      }

      .middle-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .face {
        width: calc(var(--tile-size) * 3 + var(--tile-gap) * 2);
        height: calc(var(--tile-size) * 3 + var(--tile-gap) * 2);
        display: grid;
        grid-template-columns: repeat(3, var(--tile-size));
        grid-template-rows: repeat(3, var(--tile-size));
        gap: var(--tile-gap);
        padding: var(--tile-gap);
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
      }

      .tile {
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.08);
      }

      @media (max-width: 620px) {
        :root { --tile-size: 42px; }
        .controls { flex-direction: column; }
        button { width: min(100%, 220px); }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>3×3 Rubik's Cube</h1>

      <div class="controls">
        <button id="scrambleBtn" type="button">Scramble</button>
        <button id="solveBtn" type="button" class="secondary">Solve</button>
        <button id="resetBtn" type="button" class="danger">Reset</button>
      </div>

      <div class="cube-wrap">
        <div class="cube-net" aria-label="Rubik's cube puzzle">
          <div class="face" data-face="U" aria-label="Up face"></div>

          <div class="middle-row">
            <div class="face" data-face="L" aria-label="Left face"></div>
            <div class="face" data-face="F" aria-label="Front face"></div>
            <div class="face" data-face="R" aria-label="Right face"></div>
            <div class="face" data-face="B" aria-label="Back face"></div>
          </div>

          <div class="face" data-face="D" aria-label="Down face"></div>
        </div>
      </div>
    </main>

    <script>
      const COLORS = {
        U: '#f3f4f5',
        D: '#f6d55c',
        L: '#f39a4a',
        R: '#ef4d4d',
        F: '#54d98b',
        B: '#4f7cff'
      };

      const FACE_ORDER = ['U', 'L', 'F', 'R', 'B', 'D'];
      let cube = {};
      let scrambleMoves = [];

      function buildSolvedFace(color) {
        return [
          [color, color, color],
          [color, color, color],
          [color, color, color]
        ];
      }

      function createSolvedCube() {
        const solved = {};
        FACE_ORDER.forEach((face) => {
          solved[face] = buildSolvedFace(COLORS[face]);
        });
        return solved;
      }

      function rotateMatrixClockwise(matrix) {
        const n = matrix.length;
        const rotated = Array.from({ length: n }, () => Array(n).fill(''));
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            rotated[c][n - 1 - r] = matrix[r][c];
          }
        }
        return rotated;
      }

      function rotateFace(face, clockwise = true) {
        cube[face] = rotateMatrixClockwise(cube[face]);
        if (!clockwise) {
          cube[face] = rotateMatrixClockwise(
            rotateMatrixClockwise(
              rotateMatrixClockwise(cube[face])
            )
          );
        }
      }

      function renderCube() {
        FACE_ORDER.forEach((face) => {
          const el = document.querySelector(`[data-face="${face}"]`);
          el.innerHTML = '';

          cube[face].forEach((row) => {
            row.forEach((cell) => {
              const tile = document.createElement('div');
              tile.className = 'tile';
              tile.style.background = cell;
              el.appendChild(tile);
            });
          });
        });
      }

      function randomMove() {
        const face = FACE_ORDER[Math.floor(Math.random() * FACE_ORDER.length)];
        const clockwise = Math.random() > 0.5;
        return [face, clockwise];
      }

      function scrambleCube() {
        scrambleMoves = [];
        for (let i = 0; i < 18; i++) {
          const [face, clockwise] = randomMove();
          scrambleMoves.push([face, clockwise]);
          rotateFace(face, clockwise);
        }
        renderCube();
      }

      function solveCube() {
        for (let i = scrambleMoves.length - 1; i >= 0; i--) {
          const [face, clockwise] = scrambleMoves[i];
          rotateFace(face, !clockwise);
        }
        scrambleMoves = [];
        renderCube();
      }

      function resetCube() {
        cube = createSolvedCube();
        scrambleMoves = [];
        renderCube();
      }

      FACE_ORDER.forEach((face) => {
        const el = document.querySelector(`[data-face="${face}"]`);
        el.addEventListener('click', () => {
          rotateFace(face, true);
          renderCube();
        });
      });

      document.getElementById('scrambleBtn').addEventListener('click', scrambleCube);
      document.getElementById('solveBtn').addEventListener('click', solveCube);
      document.getElementById('resetBtn').addEventListener('click', resetCube);

      cube = createSolvedCube();
      renderCube();
    </script>
  </body>
</html>
